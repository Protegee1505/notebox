name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the desktop renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace

      - name: Desktop app check
        run: cargo clippy -p notes-app --no-default-features --features desktop -- -D warnings

      - name: Web compile
        run: cargo check -p notes-app --no-default-features --features web --target wasm32-unknown-unknown

      - name: Headless crate compile for wasm
        run: cargo check -p notes-proto -p notes-core -p notes-store -p notes-sync --target wasm32-unknown-unknown

      - name: Licences and advisories
        run: cargo deny check

      - name: Free-tier simulator
        run: python3 scripts/free-tier-sim.py

      - name: Budget ceilings
        run: ./scripts/budget-check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install the matching wasm-bindgen test runner
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/, ""); print; exit}' Cargo.lock)
          echo "wasm-bindgen $version"
          mkdir -p /tmp/wasm-bindgen
          curl -sSL --fail \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp/wasm-bindgen --strip-components=1
          echo "/tmp/wasm-bindgen" >> "$GITHUB_PATH"

      - name: Loro create/edit/export/import/time-travel in Node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: /tmp/wasm-bindgen/wasm-bindgen-test-runner
        run: cargo test -p notes-core --target wasm32-unknown-unknown --test wasm_smoke

      - name: Compressed wasm size
        run: ./scripts/wasm-size.sh

  s4-opfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install clang and the matching wasm-bindgen
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/, ""); print; exit}' Cargo.lock)
          echo "wasm-bindgen $version"
          mkdir -p /tmp/wasm-bindgen
          curl -sSL --fail \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp/wasm-bindgen --strip-components=1

      - name: Install Playwright and browsers
        run: |
          mkdir -p /tmp/s4
          cd /tmp/s4
          npm init -y >/dev/null
          npm install playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit

      - name: SQLite over OPFS survives a reload in three browsers
        env:
          WASM_BINDGEN: /tmp/wasm-bindgen/wasm-bindgen
          PLAYWRIGHT_MODULES: /tmp/s4/node_modules
        run: node scripts/opfs-spike.mjs

  web:
    runs-on: ubuntu-latest
    env:
      NBX_BUILD_ID: ${{ github.run_number }}
      NBX_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install dx 0.7.10 and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          curl -sSL https://dioxus.dev/install.sh | bash -s v0.7.10
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache worker-build
        id: worker-build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
          key: worker-build-0.8.7-${{ runner.os }}

      - name: Install worker-build
        if: steps.worker-build-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Build web release with PWA files
        run: ./scripts/web-build.sh

      - name: Brotli first-load budget
        run: node scripts/web-budget.mjs target/dx/notebox/release/web/public

      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/notebox-web
          cd /tmp/notebox-web
          npm init -y >/dev/null
          npm install playwright@1.64.1 axe-core@4.10.2
          npx playwright install --with-deps chromium

      - name: Local notes, history and images survive a browser restart
        env:
          PLAYWRIGHT_MODULES: /tmp/notebox-web/node_modules
        run: node scripts/web-persist.mjs

      - name: Links and images in Write mode, desktop and phone
        env:
          PLAYWRIGHT_MODULES: /tmp/notebox-web/node_modules
        run: node scripts/web-markup.mjs

      - name: Backup export and restore round trip
        env:
          PLAYWRIGHT_MODULES: /tmp/notebox-web/node_modules
        run: node scripts/web-restore.mjs

      - name: Accessibility audit of every screen and theme
        env:
          PLAYWRIGHT_MODULES: /tmp/notebox-web/node_modules
        run: node scripts/web-a11y.mjs

      - name: Installable, offline and deliberate updates
        env:
          PLAYWRIGHT_MODULES: /tmp/notebox-web/node_modules
        run: node scripts/pwa-check.mjs

      - name: Wipe a browser, sign in, and get notes and history back
        env:
          PLAYWRIGHT_MODULES: /tmp/notebox-web/node_modules
        run: node scripts/web-wipe-login.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: notebox-web
          path: target/dx/notebox/release/web/public
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Cache worker-build
        id: worker-build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
          key: worker-build-0.8.7-${{ runner.os }}

      - name: Install worker-build
        if: steps.worker-build-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Worker compiles on wasm without warnings
        run: cargo clippy -p notes-server --target wasm32-unknown-unknown -- -D warnings

      - name: End-to-end against a real local Worker and D1
        run: node scripts/server-e2e.mjs

      - name: Two headless sync clients converge against the Worker
        run: ./scripts/sync-e2e.sh

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libxdo-dev xvfb dbus-x11

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build desktop app
        run: cargo build -p notes-app --no-default-features --features desktop

      - name: Boot smoke on a virtual display
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set +e
          dbus-run-session -- xvfb-run -a timeout 20s ./target/debug/notebox
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktop app exited before the timeout with code $code"
            exit 1
          fi
          echo "desktop app stayed up for 20s"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Windows desktop app
        run: cargo build -p notes-app --no-default-features --features desktop

      - uses: actions/upload-artifact@v4
        with:
          name: notebox-windows
          path: target/debug/notebox.exe
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Compile headless crates for Android
        env:
          CC_aarch64-linux-android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64-linux-android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo check -p notes-proto -p notes-core -p notes-store -p notes-sync --target aarch64-linux-android
