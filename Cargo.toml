[workspace]
resolver = "2"
members = [
    "crates/notes-proto",
    "crates/notes-core",
    "crates/notes-store",
    "crates/notes-sync",
    "crates/notes-server",
    "crates/notes-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# zip 9 needs 1.88; see docs/adr/0006-export-archive.md.
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
notes-proto = { path = "crates/notes-proto" }
notes-core = { path = "crates/notes-core" }
notes-store = { path = "crates/notes-store" }
notes-sync = { path = "crates/notes-sync" }
notes-server = { path = "crates/notes-server" }

# Pinned intentionally. Upgrade only with an ADR.
# `logger` is left out: its tracing subscriber reads `std::time::Instant`,
# which panics on wasm32-unknown-unknown. The app does not need console logging.
dioxus = { version = "=0.7.10", default-features = false, features = [
    "launch",
    "devtools",
    "lib",
] }

# Planned dependencies, added to crates as their phases begin.
loro = "1.16.2"
worker = { version = "0.8.7", features = ["d1"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# rusqlite 0.40 links sqlite-wasm-rs 0.5 on wasm. Keep the version in step:
# two copies of the C library would not share the installed OPFS VFS.
# See docs/adr/0004-browser-storage.md.
sqlite-wasm-rs = "0.5.1"
# Argon2id runs on the device, so it must build for native and wasm without a
# random-number source of its own: the login salt is derived from the username.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
# The native HTTP client. rustls is the default backend, never OpenSSL.
ureq = { version = "3.4.2", features = ["json"] }
pulldown-cmark = "0.13.4"
similar = "3.2.0"
# Deflate only: zopfli and the other codecs would bloat the wasm build for no
# gain on a Markdown export.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
sha2 = "0.11.1"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
thiserror = "2"
tracing = "0.1"
