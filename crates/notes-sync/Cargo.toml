[package]
name = "notes-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
notes-core.workspace = true
notes-proto.workspace = true
notes-store.workspace = true
argon2.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

# The HTTP client is only needed where there is no browser fetch. The web
# build talks to the Worker from its own origin with `fetch`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
notes-server.workspace = true
pollster = "0.4"
rpassword.workspace = true
tempfile.workspace = true
