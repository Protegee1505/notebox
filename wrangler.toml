name = "notebox"
main = "crates/notes-server/build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# `worker-build` compiles notes-server for wasm and writes the shim above.
# Install the matching version once with:
#   cargo install worker-build --version 0.8.7 --locked
[build]
command = "cd crates/notes-server && worker-build --release"

# One D1 database for notes/updates, a second for attachment chunks.
# These are the production APAC databases; local development ignores the ids,
# but they must differ or wrangler treats both bindings as one database.
[[d1_databases]]
binding = "DB_SYNC"
database_name = "notebox-sync"
database_id = "6d10cb85-f679-4607-8e1c-e997464fbf20"
migrations_dir = "migrations/sync"

[[d1_databases]]
binding = "DB_BLOBS"
database_name = "notebox-blobs"
database_id = "83a461ef-c826-4d3c-909c-1daf1c1dd7d2"
migrations_dir = "migrations/blobs"

# The one-time setup endpoint is enabled only when this secret exists:
#   npx wrangler secret put SETUP_TOKEN
# For local development and tests, pass it as a var:
#   npx wrangler dev --local --var SETUP_TOKEN:local-dev-token

# Serve the Dioxus web build from the same Worker, so browser requests are
# same-origin and the HttpOnly session cookie applies. Build it first with:
#   dx build -p notes-app --platform web --release --features web
[assets]
directory = "target/dx/notebox/release/web/public"
binding = "ASSETS"
